<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Voice Test</title>
<style>
  :root { color-scheme: dark; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; background: #111; color: #ddd; }
  select, button, label { font: inherit; }
  select, button { padding: 6px 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  #log { white-space: pre-wrap; background: #1b1b1b; padding: 12px; border-radius: 6px; min-height: 160px; font-family: ui-monospace, monospace; font-size: 13px; }
  #report { background: #181818; padding: 12px 16px; border-radius: 6px; white-space: pre-wrap; }
  audio { width: 100%; margin-top: 8px; }
  #face { --mouth: 0; width: 140px; height: 140px; border-radius: 40% 40% 45% 45%; background: #3d5a3a; position: relative; margin: 12px 0; transition: background .3s; }
  #face[data-mode="listening"] { background: #3a4d5a; }
  #face[data-mode="working"] { background: #5a4a2e; }
  #face[data-mode="done"] { background: #2e5a3e; }
  #face .eye { position: absolute; top: 38px; width: 22px; height: 22px; border-radius: 50%; background: #e8f060; }
  #face .eye.l { left: 32px; } #face .eye.r { right: 32px; }
  #face .mouth { position: absolute; left: 35px; right: 35px; bottom: 30px; height: calc(4px + var(--mouth) * 36px); border-radius: 8px; background: #1a1a1a; }
</style>
</head>
<body>
<h1>Monster voice test</h1>
<div class="row"><select id="monster"></select> <button id="go">Talk</button> <button id="stop" disabled>Hang up</button></div>
<div class="row" id="dests"></div>
<div class="row"><button id="birth" disabled>Play birth scene</button></div>
<div id="face" data-mode="idle"><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div>
<div id="audio"></div>
<h3>Report</h3>
<div id="report">(none yet)</div>
<h3>Log</h3>
<div id="log"></div>
<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.25.0/+esm";

const $ = (id) => document.getElementById(id);
const log = (...a) => { $("log").textContent += a.map(x => typeof x === "string" ? x : JSON.stringify(x)).join(" ") + "\n"; };
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  return r.json();
};
const range = (e, k, unit) => e.min[k] === e.max[k] ? `${e.max[k]} ${unit}` : `${e.min[k]}-${e.max[k]} ${unit}`;

const monsters = await api("/monsters");
for (const m of monsters) {
  $("monster").add(new Option(`${m.name} (${range(m.estimate, "llm_tokens", "tok")}, ${range(m.estimate, "credits", "cr")})${m.has_voice ? "" : " - no voice"}`, m.id));
}
for (const d of await api("/destinations")) {
  $("dests").insertAdjacentHTML("beforeend", `<label><input type="checkbox" value="${d.id}"> notify ${d.label} (${d.channel})</label>`);
}
const deliverTo = () => [...document.querySelectorAll("#dests input:checked")].map(i => i.value);

function show(run) {
  const out = run.output || {};
  if (out.speech_audio_url) $("audio").innerHTML = `<audio controls src="${out.speech_audio_url}"></audio>`;
  if (out.report) $("report").textContent = out.report;
}

// The real face listens to "monster:face" events: {mode: idle|listening|speaking|working|done, level: 0..1}.
const face = { mode: "idle", level: 0 };
function setFace(patch) {
  Object.assign(face, patch);
  $("face").dataset.mode = face.mode;
  $("face").style.setProperty("--mouth", face.level.toFixed(3));
  window.dispatchEvent(new CustomEvent("monster:face", { detail: { ...face } }));
}

const sfx = { arrive: new Audio(), working: new Audio(), done: new Audio() };
sfx.working.loop = true;
function loadSounds(m) {
  for (const [k, a] of Object.entries(sfx)) a.src = m.voice?.sounds?.[k] ?? "";
  $("birth").disabled = !m.voice?.birth_url;
}
const play = (a, volume = 0.6) => { if (a.src) { a.volume = volume; a.currentTime = 0; a.play().catch(() => {}); } };
const busy = new Set(["queued", "running", "waiting"]);
let working = false;
function setWorking(on) {
  working = on;
  if (on && sfx.working.paused) play(sfx.working, 0.3);
  if (!on) sfx.working.pause();
}

const watched = new Set();
async function watchRun(runId) {
  if (watched.has(runId)) return;
  watched.add(runId);
  for (;;) {
    const run = await api(`/runs/${runId}`);
    if (busy.has(run.status)) { setWorking(true); if (face.mode !== "speaking") setFace({ mode: "working" }); }
    else {
      setWorking(false);
      if (run.status === "completed") { play(sfx.done); setFace({ mode: "done" }); }
      if (!["needs_confirmation", "needs_input"].includes(run.status)) return;
    }
    await new Promise(r => setTimeout(r, 3000));
  }
}

let monster = monsters.find(x => x.id === $("monster").value);
if (monster) loadSounds(monster);
$("monster").onchange = () => { monster = monsters.find(x => x.id === $("monster").value); loadSounds(monster); };
$("birth").onclick = () => { if (monster?.voice?.birth_url) $("audio").innerHTML = `<audio controls autoplay src="${monster.voice.birth_url}"></audio>`; };

let conv, raf;
async function animate() {
  if (!conv) return;
  const level = Math.min(1, (await conv.getOutputVolume()) * 2.5);
  setFace({ level });
  sfx.working.volume = face.mode === "speaking" ? 0.08 : 0.3;
  raf = requestAnimationFrame(animate);
}

$("go").onclick = async () => {
  const m = monster;
  const session = await api(`/monsters/${m.id}/voice-session`);
  if (!session.signed_url) return log("no voice session:", session.detail ?? session);
  await navigator.mediaDevices.getUserMedia({ audio: true });
  conv = await Conversation.startSession({
    signedUrl: session.signed_url,
    clientTools: {
      start_run: async (inputs) => {
        const run = await api(`/monsters/${m.id}/runs`, { inputs, deliver_to: deliverTo(), notify_on_complete: deliverTo().length > 0 });
        log("start_run", inputs, "->", run.id ?? run);
        if (run.id) watchRun(run.id);
        return JSON.stringify(run.id ? { run_id: run.id, status: run.status } : run);
      },
      check_run: async ({ run_id }) => {
        const run = await api(`/runs/${run_id}`);
        log("check_run", run.status, run.error ?? "");
        show(run);
        return JSON.stringify({
          status: run.status, speech: run.output?.speech, error: run.error,
          question: run.needs_input?.message ?? run.confirm?.message,
        });
      },
      answer_input: async ({ run_id, answer }) => {
        const run = await api(`/runs/${run_id}/inputs`, { answer });
        log("answer_input", run.status ?? run);
        return JSON.stringify({ status: run.status ?? run.detail });
      },
      confirm_spend: async ({ run_id, approve }) => {
        const run = await api(`/runs/${run_id}/confirm`, { approve });
        log("confirm_spend", approve, "->", run.status ?? run);
        return JSON.stringify({ status: run.status ?? run.detail });
      },
    },
    onMessage: (msg) => log(`${msg.source}: ${msg.message}`),
    onStatusChange: (s) => log("status:", s.status ?? s),
    onConnect: () => play(sfx.arrive),
    onModeChange: ({ mode }) => setFace({ mode: mode === "speaking" ? "speaking" : working ? "working" : "listening" }),
    onError: (e) => log("error:", e),
  });
  $("go").disabled = true; $("stop").disabled = false;
  animate();
};
$("stop").onclick = async () => {
  await conv?.endSession(); conv = null; cancelAnimationFrame(raf);
  setWorking(false); setFace({ mode: "idle", level: 0 });
  $("go").disabled = false; $("stop").disabled = true;
};
</script>
</body>
</html>
